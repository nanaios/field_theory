name: Release

# One-click release: Actions -> Release -> Run workflow (on main).
# Publishes the version in gradle.properties (mod_version) to GitHub Releases, Modrinth and
# CurseForge, and creates the tag v<mod_version>. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version-type:
        description: Release type
        type: choice
        options: [release, beta, alpha]
        default: release

permissions:
  contents: write

# Where to publish. These are public, so they live here rather than in repository settings.
env:
  MODRINTH_PROJECT: field-theory   # Modrinth slug or ID
  CURSEFORGE_PROJECT: ''           # CurseForge numeric project ID (shown on the project page)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        id: meta
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the release from main (not $GITHUB_REF_NAME)"
            exit 1
          fi
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already released. Raise mod_version in gradle.properties first."
            exit 1
          fi
          TARGETS="GitHub"
          if [ -n "$MODRINTH_TOKEN" ]; then TARGETS="$TARGETS, Modrinth"; fi
          if [ -n "$CURSEFORGE_TOKEN" ]; then
            if ! [[ "$CURSEFORGE_PROJECT" =~ ^[0-9]+$ ]]; then
              echo "::error::Set CURSEFORGE_PROJECT in release.yml to the numeric CurseForge project ID"
              exit 1
            fi
            TARGETS="$TARGETS, CurseForge"
          fi
          echo "Releasing $VERSION (${{ inputs.version-type }}) to: $TARGETS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Release notes: the section of CHANGELOG.md for this version.
          awk -v head="## $VERSION" '$0 == head {found = 1; next} /^## / {if (found) exit} found' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "See CHANGELOG.md" > release_notes.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      - name: GameTests
        run: ./gradlew runGameTestServer --console=plain

      # A platform whose token secret is not set is skipped.
      - name: Publish to GitHub, Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ steps.meta.outputs.version }}
          github-commitish: ${{ github.sha }}
          modrinth-id: ${{ env.MODRINTH_PROJECT }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_PROJECT }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Field Theory ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ inputs.version-type }}
          changelog-file: release_notes.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
